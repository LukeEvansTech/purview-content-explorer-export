# Zensical Configuration
# https://zensical.org/docs/

[project]
site_name = "Purview Content Explorer Export"
site_description = "PowerShell tool for exporting item-level data from Microsoft Purview Content Explorer across EXO/SPO/ODB/Teams"
site_author = "Luke Evans"
site_url = "https://lukeevanstech.github.io/purview-content-explorer-export/"
copyright = "Copyright © 2026 Luke Evans"

docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
dev_addr = "localhost:8000"

[project.theme]
name = "material"
variant = "modern"
language = "en"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "light-blue"

[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "light-blue"

[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

# Repository Integration
repo_url = "https://github.com/LukeEvansTech/purview-content-explorer-export/"
repo_name = "LukeEvansTech/purview-content-explorer-export"
edit_uri = "edit/main/docs/docs"

